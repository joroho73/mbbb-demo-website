reviewer: "James and Paul"
review_text: "We had the Melvin Beddow Big Band for our wedding and it was the highlight of our day. The music was amazing and the singer engaged perfectly with the guests (young and old) and got everyone dancing and singing along. To top it off the band arranged a bespoke version for our first dance request perfectly. We couldn’t recommend the band highly enough. Each musician highly professional and extremely talented. We will remember their sets for the rest of our lives. Thank you so much for making our wedding such a memorable day!"
