reviewer: "Mr & Mrs Pashley"
review_text: |-
  If you are looking for a band that sound great, look great, and you want to bring that ‘wow-factor’ to your guests? Look no further!

  We got married in August 2024 and from seeing the Melvin Beddow Big Band live in the past, we knew from the moment we started wedding planning that we wanted them as our evening entertainment. Our wedding was unique hosting over 150 guests, and after a champagne tower, we wanted our guests to be transported back in time and the band did not disappoint!

  From their communication to their arrival, setup and performance, the band were just seamless. They graciously sourced our two requested songs for our first dance and father-daughter dance, and from then on when they kicked in with Glenn Miller, every single person was on their feet dancing the whole night! We requested the sets to be mostly swing tunes, ramping up the energy with some party songs towards the end. The whole band were simply amazing and our guests were very complimentary and blown away!

  We cannot thank the band enough for creating such a fantastic ambience for our evening reception, and for making the best day of our lives so memorable. We highly recommend them to anyone hoping to bring something more premium and a little different to their special occasion – it was a truly unforgettable experience and we will cherish it forever.
