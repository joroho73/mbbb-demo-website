<!-- Replace the existing enquiry form with this fragment. -->
<form class="enquiry-form" id="enquiry-form" action="/api/contact" method="post">
  <div class="field-row">
    <label>First name<input type="text" name="first-name" autocomplete="given-name" maxlength="100" required></label>
    <label>Last name<input type="text" name="last-name" autocomplete="family-name" maxlength="100" required></label>
  </div>
  <label>Email address<input type="email" name="email" autocomplete="email" maxlength="254" required></label>
  <div class="field-row">
    <label>Event date<input type="date" name="event-date"></label>
    <label>Event type<select name="event-type">
      <option value="">Please select</option>
      <option>Wedding</option><option>Dance</option><option>Theatre</option>
      <option>Private celebration</option><option>Corporate event</option><option>Other</option>
    </select></label>
  </div>
  <label>Tell us about your event<textarea name="message" rows="4" maxlength="8000" placeholder="Venue, timings, audience size and anything else that would help…" required></textarea></label>
  <div class="contact-honeypot" aria-hidden="true">
    <label>Leave this field empty<input type="text" name="website" tabindex="-1" autocomplete="off"></label>
  </div>
  <button class="button button-highlight" type="submit" id="enquiry-submit" disabled>Send enquiry <span aria-hidden="true">↗</span></button>
  <p id="enquiry-status" role="status" aria-live="polite" aria-atomic="true"></p>
  <p>Prefer email? <a class="text-link" href="mailto:mbbb@dcsmail.uk">mbbb@dcsmail.uk</a></p>
  <p class="meta">We use your details to respond to your enquiry. Read our <a href="/privacy.html">privacy policy</a>.</p>
  <noscript><p>Please email us using the link above to make an enquiry.</p></noscript>
</form>
