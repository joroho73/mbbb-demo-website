description: |- 
  We wrap up 2026 at Annie’s Jazz by welcoming back the hugely popular Melvin Beddow Big Band for a special Christmas show. From the irresistible rhythms of swing and jive, to the timeless energy of rock & roll, pop and jazz.

  With over 25 years of experience performing across Essex, they know how to put on a great show and were hugely popular on their first visit last year. Due to the size of the band, audience numbers will need to be restricted, so book in early and celebrate the Christmas season with us in style.

